name: Native checks

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Install native engine dependencies
        run: python -m pip install -r requirements-engine-build.txt
      - name: Check changed workflows and packaging
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: python -m unittest backend.test_model_interop backend.test_model_sidecar_lock backend.test_model_local_info backend.test_model_workflow scripts.test_delivery_packaging -v
      - name: Core checks
        working-directory: winui
        run: dotnet run --project tests/Luma.Core.Tests/Luma.Core.Tests.csproj -c Release
