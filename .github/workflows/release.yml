name: Native release
on:
  push:
    tags: ['v[1-9]*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release source
        run: |
          $tag = 'v' + (Get-Content -LiteralPath VERSION -Raw).Trim()
          git rev-parse --verify --quiet "$tag^{commit}" *> $null
          if ($LASTEXITCODE) { throw "Push the version tag $tag before releasing" }
          git checkout --detach $tag
          if ($LASTEXITCODE) { throw 'Release source checkout failed' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - name: Prepare workspace
        run: |
          New-Item -ItemType Directory -Force build/temp | Out-Null
          "TEMP=$pwd/build/temp" >> $env:GITHUB_ENV
          "TMP=$pwd/build/temp" >> $env:GITHUB_ENV
          "DOTNET_CLI_HOME=$pwd/build/dotnet-home" >> $env:GITHUB_ENV
          "NUGET_PACKAGES=$pwd/build/nuget-packages" >> $env:GITHUB_ENV
          "NUGET_HTTP_CACHE_PATH=$pwd/build/nuget-http" >> $env:GITHUB_ENV
          "PYINSTALLER_CONFIG_DIR=$pwd/build/pyinstaller-cache" >> $env:GITHUB_ENV
          python -m venv .venv-build
          ./.venv-build/Scripts/python.exe -m pip install -r requirements-engine-build.txt
      - name: Focused regression
        run: |
          ./.venv-build/Scripts/python.exe -m unittest worker.test_sequences worker.test_viewer backend.test_model_local_info backend.test_model_workflow scripts.test_delivery_packaging -v
          if ($LASTEXITCODE) { throw 'Regression failed' }
          Push-Location winui
          try { dotnet run --project tests/Luma.Core.Tests/Luma.Core.Tests.csproj -c Release; if ($LASTEXITCODE) { throw 'Core checks failed' } } finally { Pop-Location }
      - name: Freeze local engine
        run: ./scripts/Build-Engine.ps1
      - name: Build native application
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem -LiteralPath "$vs/VC/Redist/MSVC" -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'x64/Microsoft.VC143.CRT' } | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'vcruntime140_threads.dll') } | Select-Object -First 1
          if (-not $crt) { throw 'Microsoft VC143 redistributable not found' }
          $version = (Get-Item -LiteralPath (Join-Path $crt 'vcruntime140.dll')).VersionInfo.FileVersion
          ./scripts/Build-WinUI.ps1 -CrtDirectory $crt -CrtVersion $version
          ./.venv-build/Scripts/python.exe scripts/check_frozen_runtime.py --engine release/Engine-1.2.0/engine/Luma.Engine.exe --report build/frozen-runtime.json
          if ($LASTEXITCODE) { throw 'Frozen runtime failed' }
      - name: Package installer and portable
        run: |
          $pin = Get-Content -LiteralPath packaging/nsis-toolchain.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force build/toolchain | Out-Null
          $download = Invoke-WebRequest -Uri $pin.source -OutFile build/toolchain/nsis.zip -PassThru -TimeoutSec 60
          if ((Get-FileHash build/toolchain/nsis.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) {
            if ([string]$download.Headers['Content-Type'] -notlike 'text/html*' -or (Get-Item build/toolchain/nsis.zip).Length -gt 1MB) { throw 'Unexpected NSIS download response' }
            $path = ([Uri]$pin.source).AbsolutePath
            $pattern = 'https://downloads\.sourceforge\.net' + [regex]::Escape($path) + '\?ts=[^"\s<>]+'
            $link = [regex]::Match((Get-Content -LiteralPath build/toolchain/nsis.zip -Raw), $pattern)
            if (-not $link.Success) { throw 'Official NSIS download link not found' }
            Invoke-WebRequest -Uri ([Net.WebUtility]::HtmlDecode($link.Value)) -OutFile build/toolchain/nsis.zip -TimeoutSec 60
          }
          if ((Get-FileHash build/toolchain/nsis.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'NSIS checksum mismatch' }
          Expand-Archive -LiteralPath build/toolchain/nsis.zip -DestinationPath build/toolchain/nsis
          $compiler = (Get-ChildItem -LiteralPath build/toolchain/nsis -Recurse -File -Filter makensis.exe | Select-Object -First 1).FullName
          ./scripts/Build-Delivery.ps1 -BundleDirectory release/Luma-native-1.2.0 -OutputDirectory release/Luma-1.2.0 -Compiler $compiler
          ./.venv-build/Scripts/python.exe scripts/verify_native_delivery.py --bundle release/Luma-native-1.2.0 --delivery release/Luma-1.2.0 --evidence build/frozen-runtime.json --report build/delivery-verification.json
          if ($LASTEXITCODE) { throw 'Delivery verification failed' }
          Get-ChildItem -LiteralPath release/Luma-1.2.0 -File | Where-Object Extension -In '.exe','.zip' | ForEach-Object { ((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name) } | Set-Content release/Luma-1.2.0/SHA256SUMS.txt
      - name: Publish stable release
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag *> $null
          if ($LASTEXITCODE) { gh release create $tag --verify-tag --title "Luma $($tag.Substring(1))" --notes-file docs/RELEASE_NOTES.md --draft }
          if ($LASTEXITCODE) { throw 'Release creation failed' }
          gh release upload $tag release/Luma-1.2.0/Luma-1.2.0-Setup-x64.exe release/Luma-1.2.0/Luma-1.2.0-Portable-x64.zip release/Luma-1.2.0/SHA256SUMS.txt release/Luma-1.2.0/delivery-manifest.json --clobber
          if ($LASTEXITCODE) { throw 'Release upload failed' }
          gh release edit $tag --draft=false --prerelease=false --latest
          if ($LASTEXITCODE) { throw 'Release publication failed' }
